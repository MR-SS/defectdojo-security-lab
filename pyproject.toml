[project]
name = "defectdojo-security-lab"
version = "0.1.0"
description = "Local-only DefectDojo security research lab"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "PyYAML==6.0.2",
  "pydantic==2.12.5",
  "pytest==8.4.2",
]

[project.optional-dependencies]
quality = ["ruff==0.14.4", "mypy==1.18.2"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires a running isolated DefectDojo environment",
  "slow: bounded but resource-consuming local experiment",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
